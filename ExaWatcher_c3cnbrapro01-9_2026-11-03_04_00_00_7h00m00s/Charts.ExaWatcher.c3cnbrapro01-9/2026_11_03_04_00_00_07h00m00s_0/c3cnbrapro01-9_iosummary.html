          //------------------------------------------------------------
          // function to dynamically append chart to HTML
          // we do this dynamically so it does not leave large gaps when
          // run on EF or compute nodes
          var appendChart = function(chartId,dtype, stat)
          {
            // determine converter based on type of stat
            var converter;
            var chartTitle;
            if (dtype == "flash")
            {
              chartTitle = "Flash";
            }
            else if (dtype == "cflash")
            {
              chartTitle = "Capacity Flash"
            }
            else
            {
              chartTitle = "Hard Disk";
            }

            switch (stat)
            {
              case "iops": converter = "psecConverter";
                           chartTitle += " IOPs";
                           break;
              case "mbps": converter = "mbpsConverter";
                           chartTitle += " MB/s";
                           break;
              case "svctm": converter = "msConverter";
                            chartTitle += " Service Time";
                            break;
              case "util": converter = "pctConverter";
                           chartTitle += " Utilization";
                           break;
              case "rwawait": converter = "msConverter";
                           chartTitle += " Wait time";
                           break;
              case 'avgrqsz': converter = "kbConverter";
                           chartTitle += " Avg Request Size";
                           break;
              default:     chartTitle += " " + stat;
            }
            // check for reference object
            var refObject = ( chartModel.referenceObjects.hasOwnProperty(dtype) && chartModel.referenceObjects[dtype].hasOwnProperty(stat) ?
    'y-axis.reference-objects="[[referenceObjects.' + dtype+'.'+ stat + ']]" ' 
    : '');
            // string for oj-chart
            var chartType = (stat == "svctm" ? "lineWithArea" : "line"); 
            var chartSeries = dtype + '.' + stat;
            var ojChart = '<oj-chart id="' + chartId + '" class="exachart" ' +
                            'type="' + chartType + '" ' +
                            'series="[[seriesValues.' + chartSeries + ']]" ' +
                            'groups="[[lineGroupsValue]]" ' +
                            'hide-and-show-behavior="withRescale" ' +
                            'animation-on-display="auto" ' +
                            'animation-on-data-change="auto" ' +
                            'orientation="vertical" ' +
                            'hover-behavior="dim" ' +
                            'selection-mode="single" ' +
                            'time-axis-type="enabled" ' +
                            'x-axis.viewport-min="[[lineXAxis.' +
                               chartSeries + '.viewportMin]]" ' +
                            'x-axis.viewport-max="[[lineXAxis.' +
                               chartSeries + '.viewportMax]]" ' +
                            'y-axis.tick-label.scaling="none" ' +
                            'y-axis.tick-label.converter="[[' + converter +
                               ']]"' +
                            refObject +
                            'tooltip.renderer="[[tooltipFunction]]" ' +
                            'zoom-and-scroll="live" ' +
                            'overview.rendered="on" overview.height="70px" ' +
                            'on-oj-viewport-change="[[updateXAxis]]" ' +
                            'on-oj-viewport-change-input="[[updateXAxis]]" ' +
                          '>' +
                          '</oj-chart>';
            // get index of dtype to determine column id to use
            var dtypeColumn =
                  stat + 'Col' + chartModel.diskTypes.indexOf(dtype);

            // in case placeholder does not exist
            if ( $('#' + dtypeColumn).length == 0)
            {
              dtypeColumn =
                'chartsColDir' + chartModel.diskTypes.indexOf(dtype);
            }
            // create collapsible for chart
            var collapsible = document.createElement('oj-collapsible');
            var collapsibleId = dtype + stat + 'Collapsible';
            $(collapsible).attr( { id: collapsibleId, expanded: true });
            var header = '<h2 slot="header" tabindex="0" class="oj-header oj-typography-subheading-sm">' + chartTitle + '</h2>';
            // append header and chart to collapsible
            $(collapsible).append(header);
            $(collapsible).append(ojChart);

            // append collapsible to the proper div
            $('#' + dtypeColumn).append(collapsible);
          }

          function adjustContentPadding() 
          {
            // assumes elements for fixed-top, fixed-bottom and content exist
            var topElemHeight = $('.oj-applayout-fixed-top')[0].offsetHeight;
            var bottomElemHeight = $('.oj-applayout-fixed-bottom')[0].clientHeight;
            var contentElem = $('.oj-applayout-content')[0];
            $(contentElem).css( { paddingTop: topElemHeight + 'px',
                                  paddingBottom: bottomElemHeight + 'px' }).
              addClass('oj-complete');
          }

          //------------------------------------------------------------
          // create model 
          var chartModel = new ChartModel();

          // dynamically add charts and create a map
          var debug_stats = [ 'avgqusz' ];
          var map = {};
          for (var i = 0; i < chartModel.diskTypes.length; i++)
          {
            var dtype = chartModel.diskTypes[i];
            for (var stat in chartModel.seriesValues[dtype])
            {
              var chartId = chartModel.generateChartId(dtype, stat);
              map[chartId] = { "stat": stat, "dtype": dtype };
              // if this is one of our debug charts, we should append
              // to main chartsCol# div as an oj-flex-item
              if (debug_stats.indexOf(stat) != -1)
              {
                var itemDiv = document.createElement('div');
                $(itemDiv).attr({id: stat + 'Col' + i, class: 'oj-flex-item'});
                $('#chartsColDir' + i).append(itemDiv);
              }              
              // add charts to HTML
              appendChart(chartId,dtype,stat)
            }
          }

          $(document).ready(
            function()
            {
              ko.applyBindings(chartModel, document.getElementById("chart-container"));
