          var addSelector = function()
          {
            // append label
            var ojLabel=document.createElement("oj-label");
            $(ojLabel).attr( { for: "cpu_combo_box" });
            var txt = document.createTextNode("CPU");
            $(ojLabel).append(txt);

            // create combobox
            var ojComboBox = document.createElement("oj-combobox-one");
            $(ojComboBox).attr( {
              id: "cpu_combo_box",
              value: "{{initValue}}",
              style: "width:100%" });

            // create list to append to combobox
            var item;
            for (var i = 0; i < chartModel.selectList().length; i++)
            {
              item = chartModel.selectList()[i];
              var ojOption = document.createElement("oj-option");
              $(ojOption).attr("value", item.value);
              // $(ojOption).val(item.label);
              var txt = document.createTextNode(item.label);
              $(ojOption).append(txt);
              // check for image here
              if (item.hasOwnProperty('type'))
              {
                 var img = document.createElement("span");
                 $(img).attr( { role: "presentation", title: item.type, slot:
      "startIcon", style:"vertical-align:middle" } );
                 if (item.type === "alert")
                   $(img).attr( { class: "oj-fwk-icon oj-fwk-icon-status-error" } );
                 else if (item.type === "warning")
                   $(img).attr( { class: "oj-fwk-icon oj-fwk-icon-status-warning" });
                  // append image
                 $(ojOption).append(img);
              }
              // append to combo box
              $(ojComboBox).append(ojOption);
              
            }

            $(ojComboBox).attr("aria-label","CPU");
            $(ojComboBox).attr("on-value-changed","[[valueChangeHandler]]");
            $("#cpu_selector").append(ojLabel);              
            $("#cpu_selector").append(ojComboBox);
          }

          function adjustContentPadding() 
          {
            // assumes elements for fixed-top, fixed-bottom and content exist
            var topElemHeight = $('.oj-applayout-fixed-top')[0].offsetHeight;
            var bottomElemHeight = $('.oj-applayout-fixed-bottom')[0].clientHeight;
            var contentElem = $('.oj-applayout-content')[0];
            $(contentElem).css( { paddingTop: topElemHeight + 'px',
                                  paddingBottom: bottomElemHeight + 'px' }).
              addClass('oj-complete');
          }

          //------------------------------------------------------------
          // create chart model
          var chartModel = new ChartModelCPU()

          // only add selectors if we have outlier cpus
          if (chartModel.selectList().length > 1)
          {
            addSelector();
          }

          $(document).ready(
            function()
            {
              ko.applyBindings(chartModel, document.getElementById("chart-container"));
              adjustContentPadding();
            });
        });
    </script>

  <body class="oj-web-applayout-body">
    <div id="chart-container">
      <div id="page" class="oj-web-applayout-page">
        <!-- Header -->
        <header role="banner" 
          class="oj-applayout-fixed-top oj-web-applayout-header">
            <div class="oj-flex-bar oj-sm-align-items-center">
              <div class="oj-flex-bar-start oj-sm-align-items-baseline">
                <h1 tabindex="0" class="oj-web-applayout-header-title oj-typography-heading-md" title="ExaWatcher CPU Detail Charts">ExaWatcher CPU Detail Charts</h1>
              </div>

              <div class="oj-flex-bar-end oj-typography-body-sm">
                <span id="host" data-bind="text:reportContext.host"></span>:
                <span id="startTime" data-bind="text:reportStartTime"></span> -
                <span id="endTime" data-bind="text:reportEndTime"></span>
              </div>

            </div> <!-- oj-flex-bar -->
        </header>

        <div role="main" class="oj-applayout-content">
          <div class="oj-web-applayout-content">

            <div class="oj-sm-odd-cols-12">
              <div class="oj-flex">
                <div class="oj-flex-item">
                  <h2 tabindex="0" class="oj-header oj-typography-subheading-xs">Average CPU Utilization by CPU ID</h2>
                  <div id="cpuIdChartDiv">
                    <oj-chart id="cpuIdChart" class="exachart"
                      type="bar"
                      series="[[cpuIdsValue]]"
                      groups="[[cpuIdsXAxis]]"
                      animation-on-display="auto"
                      animation-on-data-change="auto"
                      orientation="vertical"
                      hover-behavior="dim"
                      selection-mode="single"
                      hide-and-show-behavior="withRescale"
                      stack="on"
                      tooltip.renderer="[[tooltipCpuIdFunction]]"
                      y-axis.tick-label.converter="[[pctConverter]]">
                    </oj-chart>
                  </div>
                </div> 
              </div> <!-- oj-flex -->
              <!-- selector only shown if we have outliers-->
              <div class="oj-flex">
                <div id="cpu_selector" class="oj-flex-item">
                </div>
              </div>
              <div class="oj-flex">
                <div class="oj-flex-item">
                  <h2 tabindex="0" class="oj-header oj-typography-subheading-xs">CPU Utilization</h2>
                   <div id="allChartDiv">
                    <oj-chart id="allChart" class="exachart"
                      type="lineWithArea"
                      series="[[lineSeriesValue]]"
                      groups="[[lineGroupsValue]]"
                      animation-on-display="auto"
                      animation-on-data-change="auto"
                      orientation="vertical"
                      hover-behavior="dim"
                      selection-mode="single"
                      hide-and-show-behavior="withRescale"
                      stack="on"
                      tooltip.renderer="[[tooltipFunction]]"
                      time-axis-type="enabled"
                      y-axis.tick-label.converter="[[pctConverter]]"
                      zoom-and-scroll="live"
                      overview.rendered="on" overview.height="70px">
                    </oj-chart>
                  </div>   
                </div>      
              </div>

            </div> <!-- oj-sm-odd-cols-12 -->
            <p tabindex=0 class="oj-typography-body-sm exa" aria-label="Processed files">Processed files:<span id="processedFiles"
                data-bind="foreach:reportContext.processedFiles">
               <span data-bind="text:$data"></span>, 
            </span></p>
          </div> <!-- oj-web-applayout-content -->
        </div> <!-- oj-applayout-content -->

        <footer role="contentinfo" class="oj-web-applayout-footer oj-applayout-fixed-bottom">
          <p tabindex=0 class="oj-typography-body-sm exa" aria-label="Footer text">Number of buckets: <span id="numBuckets" data-bind="text:reportContext.numBuckets"></span>; Bucket Interval: <span id="bucketInterval" data-bind="text:reportContext.bucketInterval"></span></p>
        </footer>

      </div> <!-- oj-web-applayout-page -->
    </div> <!-- chart-container -->
  </body>     
</html>
