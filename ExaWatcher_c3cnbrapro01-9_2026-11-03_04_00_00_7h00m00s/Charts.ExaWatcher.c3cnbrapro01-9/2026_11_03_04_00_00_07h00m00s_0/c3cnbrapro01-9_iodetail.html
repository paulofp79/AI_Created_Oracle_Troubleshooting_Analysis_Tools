            self.dateTimeConverter = oj.Validation.converterFactory("datetime").createConverter( { formatType: "datetime", dateFormat: "short",  timeFormat: "medium"} );

            // scale to us as required
            self.msConverter = {
              format : function(value)
              {
                var valueString;
                var converter;
                if (value < 1)
                  valueString = self.usConverter.format(value*1000);
                else
                {
                  converter = oj.Validation.converterFactory("number").createConverter( { pattern: "##,###.##ms", useGrouping: true, minimumFractionDigits: 2,  maximumFractionDigits: 2 });
                  valueString = converter.format(value);
                }
                return valueString;
              }
            } // self.msConverter

            // common private functions
            var getConverter = function(statType)
            {
              var converter;
              switch (statType)
              {
                case "iops": 
                  converter = self.psecConverter;
                  break;
                case "mbps": 
                  converter = self.mbpsConverter;
                  break;
                case "svctm": 
                case "await":
                case "r_await":
                case "w_await":
                  converter = self.msConverter;
                  break;
                case "util": 
                  converter = self.pctConverter;
                  break;
                case "avgrqsz":
                case "rareqsz":
                case "wareqsz":
                  converter = self.kbConverter;
                  break;
                default:
                  converter = new oj.IntlNumberConverter;
                  break;
              }
              return converter;
            } // getConverter


            // helper function to generate/extract series ids to support
            // tooltips since we can no longer get component from oj-chart
            var generateSeriesId = function(dtype, stat, device)
            {
              return dtype + ':' + stat + ':' + device;
            }
   
            var extractSeriesInfo = function(id)
            {
              var delimDtype = id.indexOf(':',0);
              var delimStat = (delimDtype !== -1 ? 
                               id.indexOf(':',delimDtype + 1) :
                               -1);
              var retObj;
              if (delimDtype !== -1 && delimStat !== -1)
                retObj = { 'dtype' : id.substring(0,delimDtype),
                           'stat'  : id.substring(delimDtype+1,delimStat),
                           'device'  : id.substring(delimStat+1) };
              else 
                retObj = { 'dtype' : id,
                           'stat'  : id,
                           'device'  : id };
              return retObj;
            }

            var extractSeriesId = function(id)
            {
              return extractSeriesInfo(id).device;
            }

            // exposed helper functions
            self.generateChartId = function(dtype, stat)
            {
              return dtype + stat + "Chart";
            }

            self.getSeriesItem = function(dtype, stat, disk_id)
            {

              if (disk_id == "all")
                return data[dtype][stat];
              else
                return data[dtype][stat].filter(function(obj) { return obj.id == generateSeriesId(dtype,stat,disk_id); });
            } // getSeriesItem

              // note, we cannot look for it in xAxisDates/lineGroupsValue
              // as dates are objects, and two objects are never equal
              var itemPosition = xAxis.indexOf(origDate);

              // determine chart that is being processed
              var seriesInfo = extractSeriesInfo(dataContext.series);
              var seriesArray = null;
              var refArray = null;
              var converter;
              var chartStat = seriesInfo.stat;
              var chartDiskType = seriesInfo.dtype;
              seriesArray = self.seriesValues[chartDiskType][chartStat]();
              refArray = self.yAxisData[chartDiskType][chartStat]().referenceObjects[0].items;
              converter = getConverter(chartStat);                

              // start building the tooltip
              var tooltipString = "<b>" + self.dateTimeConverter.format(origDate) + "</b><br/>";
              // determine what to display based on series
              tooltipString += "<b>" + seriesInfo.device + "</b>: ";
              tooltipString += converter.format(dataContext.value);
              if (seriesInfo.device == "avg")
              {
                // find reference object
                var refItem =
      self.yAxisData[chartDiskType][chartStat]().referenceObjects[0].items[itemPosition];

            // slow; and we also want 'All' option

              var allSelected;
              var initList;
              if (event == null)
                return;
              if (event.target.id == "f_select")

                              "flashrpsChart", "flashwpsChart",
                              "flashrmbpsChart", "flashwmbpsChart" ];
                initList = self.initFlashList;
              }

                               "disksvctmChart", "diskawaitChart",
                               "diskutilChart",
                               "diskavgrqszChart",
                               "diskrareqszChart", "diskwareqszChart",
                               "diskavgquszChart",
                               "diskr_awaitChart", "diskw_awaitChart",
                               "diskrpsChart", "diskwpsChart",
                               "diskrmbpsChart", "diskwmbpsChart" ];

                               "cflashsvctmChart", "cflashawaitChart",
                               "cflashutilChart",
                               "cflashavgrqszChart",
                               "cflashrareqszChart", "cflashwareqszChart",

                               "cflashrpsChart", "cflashwpsChart",
                               "cflashrmbpsChart", "cflashwmbpsChart" ];
                 initList = self.initCFlashList;

              var toAdd = false;
              var diskSeries = arrayDiff(data.value, data.previousValue);

              {

                  toAdd = true;
                for (var chart=0; chart < chartList.length; chart++)
                {

                    continue;
                  var stat = map[chartList[chart]].stat;

                  {

                    if (disk !== "all" && toAdd)
                    {
                      chartModel.seriesValues[dtype][stat].push(chartModel.getSeriesItem(dtype,stat,disk)[0]);
                    }
                    else if (disk !== "all" && !toAdd)

                      chartModel.seriesValues[dtype][stat].remove(function(item) { return item.id == generateSeriesId(dtype,stat,disk); });

                      var options = [ "all" ]
                      for (var i = 0; i < seriesItems.length; i++)

                      initList.removeAll();
                      initList.push("avg");
                    }
                  }
                }

                $("#header").trigger('heightChange');
              }
